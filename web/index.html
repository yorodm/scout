<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Scout — self-hosted error tracking</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c9cff'/%3E%3Cpath d='M9 21l5-10 4 7 2-3 3 6' stroke='%230b1020' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="login" class="login hidden"></div>

    <div id="shell" class="shell hidden">
      <aside class="sidebar">
        <a class="brand" href="#/issues">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="28" height="28">
              <rect width="32" height="32" rx="8" fill="currentColor" opacity="0.16" />
              <path
                d="M8 21l5.5-11 4.2 7.4 2.4-3.6L24 21"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
          <span>
            <strong>Scout</strong>
            <small>self-hosted telemetry</small>
          </span>
        </a>

        <div class="switch-block">
          <label for="project-select">Project</label>
          <select id="project-select"></select>
          <div id="project-role" class="role-line"></div>
        </div>

        <nav class="nav" id="nav">
          <a href="#/issues" data-nav="issues"><span class="dot"></span>Issues</a>
          <a href="#/logs" data-nav="logs"><span class="dot"></span>Logs</a>
          <a href="#/search" data-nav="search"><span class="dot"></span>Search</a>
          <a href="#/members" data-nav="members"><span class="dot"></span>Members</a>
          <a href="#/settings" data-nav="settings" id="nav-settings"
            ><span class="dot"></span>Settings</a
          >
        </nav>

        <div class="sidebar-foot">
          <div class="user-pill">
            <span class="avatar" id="user-avatar">D</span>
            <span class="user-meta">
              <strong id="user-name">Demo</strong>
              <small id="user-email">demo@scout.local</small>
            </span>
          </div>
          <button class="btn ghost small" id="logout" type="button">Sign out</button>
          <div class="build-note">prototype · in-memory store</div>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <div class="topbar-title">
            <button class="icon-btn hidden" id="back-btn" type="button" aria-label="Back">
              ←
            </button>
            <div>
              <h2 id="topbar-title">Issues</h2>
              <p id="topbar-sub" class="muted"></p>
            </div>
          </div>
          <div class="topbar-actions" id="topbar-actions"></div>
        </header>
        <main id="view"></main>
      </div>
    </div>

    <div id="modal-root"></div>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

    <script src="/app.js"></script>
  </body>
</html>
