# Single-node Garage configuration for the development compose stack.
#
# Replace rpc_secret and admin_token before exposing this anywhere. The compose
# file starts Garage with --single-node --default-bucket and the
# GARAGE_DEFAULT_* variables, so the layout, bucket, and access key are created
# automatically; see https://garagehq.deuxfleurs.fr/documentation/quick-start/
# for the manual fallback on older versions or custom layouts.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_secret = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "scout-dev-admin-token"
