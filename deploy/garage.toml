# Single-node Garage configuration for the development compose stack.
#
# Replace rpc_secret and admin_token before exposing this anywhere, and see
# https://garagehq.deuxfleurs.fr/documentation/quick-start/ for cluster layout,
# bucket, and access-key setup (the compose file intentionally does not automate
# those steps).

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_mode = "1"

rpc_bind_addr = "[::]:3901"
rpc_secret = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "scout-dev-admin-token"
