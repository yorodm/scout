# One deployment unit: the Scout binary, PostgreSQL for metadata, and
# S3-compatible object storage for immutable raw payloads.
#
# Override the operator bootstrap values (and the object-store credentials) in a
# .env file or your orchestrator's secret store before exposing this anywhere.
services:
  scout:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      SCOUT_SELF_URL: ${SCOUT_SELF_URL:-http://127.0.0.1:8080}
      RUST_LOG: ${RUST_LOG:-info}
      DATABASE_URL: postgres://scout:scout@postgres:5432/scout
      SCOUT_S3_ENDPOINT: http://garage:3900
      SCOUT_S3_BUCKET: ${SCOUT_S3_DEFAULT_BUCKET:-scout-raw}
      AWS_ACCESS_KEY_ID: ${SCOUT_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${SCOUT_S3_SECRET_KEY:-}
      AWS_REGION: ${SCOUT_S3_REGION:-garage}
      SCOUT_OPERATOR_EMAIL: ${SCOUT_OPERATOR_EMAIL:-operator@scout.local}
      SCOUT_OPERATOR_PASSWORD: ${SCOUT_OPERATOR_PASSWORD:-change-me-now}
      # Demo data plus /api/demo/* (including an unauthenticated reset). Set to
      # false before exposing this stack to real users.
      SCOUT_DEMO_MODE: ${SCOUT_DEMO_MODE:-true}
      SCOUT_RETENTION_DAYS: "30"
      SCOUT_CONFIDENCE_THRESHOLD: "0.5"
      SCOUT_INGEST_MAX_IN_FLIGHT: "256"
      SCOUT_SESSION_TTL_DAYS: "7"
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
      POSTGRES_DB: scout
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d scout"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Single-node Garage (S3-compatible). The image has no ENTRYPOINT, so the
  # command below is the full argv. `--single-node` assigns the layout and
  # `--default-bucket` creates the bucket and access key from GARAGE_DEFAULT_*,
  # which compose maps from the SCOUT_S3_* exports.
  garage:
    image: dxflrs/garage:v2.5.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${SCOUT_S3_ACCESS_KEY:-}
      GARAGE_DEFAULT_SECRET_KEY: ${SCOUT_S3_SECRET_KEY:-}
      GARAGE_DEFAULT_BUCKET: ${SCOUT_S3_DEFAULT_BUCKET:-scout-raw}
    ports:
      - "3900:3900"
      # The admin API is for local operators only.
      - "127.0.0.1:3903:3903"
    volumes:
      - ./deploy/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  garage-data:
