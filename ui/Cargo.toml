[package]
name = "scout-ui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
publish = false

[dependencies]
sycamore = "0.9.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-net = { version = "0.6", features = ["http", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "Event",
    "EventTarget",
    "KeyboardEvent",
    "MouseEvent",
    "Storage",
    "Location",
    "Navigator",
    "Clipboard",
    "console",
] }
console_error_panic_hook = "0.1"
gloo-timers = { version = "0.3", features = ["futures"] }
